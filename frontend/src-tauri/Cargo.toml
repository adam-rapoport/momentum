[package]
name = "app"
# Keep in sync with tauri.conf.json (the source of truth for the app version),
# backend/pyproject.toml and frontend/package.json.
version = "0.1.0"
description = "Momentum desktop shell — Tauri 2 wrapper around the Next.js UI and the Python backend sidecar"
authors = ["Adam Rapoport"]
# Private project, no license — all rights reserved (see README.md).
publish = false
repository = "https://github.com/adam-rapoport/momentum"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
# Spawns + manages the bundled Python backend as a sidecar process.
tauri-plugin-shell = "2"
# Opens external URLs (e.g. the Google OAuth login) in the user's real browser;
# the in-app webview can't navigate to external sites.
tauri-plugin-opener = "2"
