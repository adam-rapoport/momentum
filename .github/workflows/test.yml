name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    strategy:
      fail-fast: false
      matrix:
        include:
          # SQLite is the shipping default (desktop build) — no service needed.
          - db: sqlite
            test_database_url: ""
          # Postgres proves the dialect-portable models still work there too.
          - db: postgres
            test_database_url: postgresql+asyncpg://postgres:postgres@localhost:5432/pmomentum_test

    services:
      # Always available; only the Postgres matrix leg actually connects to it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Which DB the integration tests run against. Empty -> tests/conftest.py
      # uses a throwaway SQLite file. Set -> it creates pmomentum_test and runs
      # alembic migrations against Postgres.
      TEST_DATABASE_URL: ${{ matrix.test_database_url }}
      # `app.config.Settings` validates these at import time, and most tests
      # transitively import the settings module. CI has no .env (it's
      # gitignored), so fill in placeholders. DATABASE_URL is never connected
      # to during tests — conftest uses TEST_DATABASE_URL. GROQ_API_KEY isn't
      # called from any unit test (LLM clients are constructed lazily).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pmomentum_test
      GROQ_API_KEY: ci-placeholder-not-a-real-key
      # The model_router tests assert Gemini/Gemma models are picker-available;
      # the registry filters Google models out when GOOGLE_AI_API_KEY is unset.
      # Placeholder is enough — no actual call goes out to Google during tests.
      GOOGLE_AI_API_KEY: ci-placeholder-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (unit + integration)
        run: pytest -q
