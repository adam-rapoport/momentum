name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Sprint 6 Chunk D: integration tests use this URL. tests/conftest.py
      # creates the `pmomentum_test` database and runs alembic migrations
      # against it.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pmomentum_test
      # `app.config.Settings` validates these at import time, and most
      # tests transitively import the settings module. Locally the values
      # come from backend/.env (gitignored). CI has no .env, so fill in
      # placeholders. Real connections during tests use TEST_DATABASE_URL
      # via tests/conftest.py; GROQ_API_KEY isn't called from any unit
      # test (LLM clients are constructed lazily and not exercised here).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pmomentum_test
      REDIS_URL: redis://localhost:6379
      GROQ_API_KEY: ci-placeholder-not-a-real-key
      # The model_router tests assert that Gemini/Gemma models are
      # picker-available; the registry filters Google models out when
      # GOOGLE_AI_API_KEY is unset. Placeholder is enough — no actual
      # call goes out to Google during tests.
      GOOGLE_AI_API_KEY: ci-placeholder-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (unit + integration)
        run: pytest -q
