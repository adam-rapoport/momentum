name: Desktop build (Apple Silicon)

# Produces the NATIVE arm64 macOS .dmg.
#
# Why CI: the usual dev Mac is Intel and PyInstaller cannot cross-compile, so a
# native arm64 build MUST run on Apple Silicon hardware. GitHub's macos-latest
# runners are Apple Silicon (arm64) — the same runner the advisory sidecar job
# in test.yml already freezes the arm64 backend on. build-desktop.sh derives the
# target triple from the host (aarch64-apple-darwin here), so NO script change
# is needed for the architecture.
#
# Trigger: manual (workflow_dispatch) only. Version tags are owned by
# release.yml, which builds BOTH architectures (signed when secrets exist) and
# drafts the GitHub Release — this workflow remains as a cheap one-off arm64
# smoke build.
#
# Output: an UNSIGNED .dmg. Note: CI verifies the build + the frozen sidecar's
# --selfcheck, but cannot launch the GUI; a one-time double-click check on any
# M-series Mac confirms the window/Keychain/handshake path.

on:
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: build native arm64 .dmg (macos-latest / Apple Silicon)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-desktop.lock

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust (stable; host target = aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # build-desktop.sh expects backend/.venv to already exist; otherwise it
      # falls back to calling `python3.12`, which isn't guaranteed on PATH on the
      # runner. Pre-create the venv with the 3.12 interpreter from setup-python
      # so the script installs the pinned desktop deps into it.
      - name: Pre-create backend venv (so build-desktop.sh reuses it)
        run: python -m venv backend/.venv

      # The build script runs `npx tauri build` (which triggers `npm run build`)
      # but does NOT install node deps itself — a fresh CI checkout has none.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Build the .app only (PM_BUNDLES=app). Tauri's bundle_dmg.sh needs a
      # Finder/GUI session to lay out the DMG window and fails on headless
      # runners, so we build the app here and wrap a plain (headless-safe) DMG
      # with hdiutil below.
      - name: Build desktop app (unsigned, native arm64)
        env:
          PM_BUNDLES: app
        run: ./build-desktop.sh

      # hdiutil create -srcfolder is a pure CLI op (no Finder/GUI) — reliable on
      # headless runners. Produces a drag-to-Applications DMG (app + an
      # Applications symlink), just without bundle_dmg.sh's background styling.
      - name: Package a headless-safe .dmg (drag-to-Applications)
        run: |
          set -euo pipefail
          APP="frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Momentum.app"
          test -d "$APP" || { echo "ERROR: $APP not found"; exit 1; }
          VERSION="$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")"
          DMG="Momentum_${VERSION}_aarch64.dmg"
          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Momentum" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          rm -rf "$STAGING"
          echo "Built $DMG"; ls -lh "$DMG"

      - name: Upload arm64 .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: momentum-macos-arm64-dmg
          path: Momentum_*_aarch64.dmg
          if-no-files-found: error
