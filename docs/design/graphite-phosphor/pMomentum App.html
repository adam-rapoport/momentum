<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pMomentum — Desktop App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* ── light theme — cool graphite ── */
    --bg-app: #F2F3F3;          /* window background */
    --bg-panel: #EAEBEB;        /* sidebar / context panel */
    --bg-surface: #FFFFFF;      /* cards, composer */
    --bg-raised: #F7F8F8;       /* hover rows, code wells */
    --bg-inset: #E3E4E4;        /* inset wells */
    --text: #17181A;
    --text-muted: #65696E;
    --text-dim: #94999F;
    --border: #DEDFE0;
    --border-strong: #C8CACC;
    --border-faint: #E8E9E9;

    /* accent — pixel green by default; pm-app.jsx rewrites these from tweaks */
    --accent: #0F9D63;
    --accent-bright: #0F9D63;   /* dots, glows, selection accents */
    --accent-fg: #F4FBF7;       /* text on solid accent */
    --accent-tint: #E2F3EB;     /* soft fills */
    --accent-tint-2: #EFF8F3;   /* softer fills */
    --accent-text: #0B7A4D;     /* accent-colored text, AA on bg */

    --warn: #B07C18;
    --warn-soft: #F5E8C8;
    --danger: #C2452E;
    --danger-soft: #F6DCD5;
    --ok: #0F9D63;
    --ok-soft: #DCF0E6;

    --shadow-card: 0 1px 2px rgba(20, 24, 28, 0.05), 0 6px 20px -8px rgba(20, 24, 28, 0.08);
    --shadow-pop: 0 2px 6px rgba(20, 24, 28, 0.08), 0 20px 50px -16px rgba(20, 24, 28, 0.22);
    --shadow-composer: 0 1px 2px rgba(20, 24, 28, 0.04), 0 10px 32px -12px rgba(20, 24, 28, 0.14);

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;

    --font-ui: 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --font-pixel: 'Silkscreen', 'IBM Plex Mono', monospace;

    --sidebar-w: 264px;
    --context-w: 312px;
    --toolbar-h: 48px;
  }

  [data-theme="dark"] {
    --bg-app: #131416;
    --bg-panel: #18191C;
    --bg-surface: #1F2024;
    --bg-raised: #26272C;
    --bg-inset: #0E0F10;
    --text: #ECEDEE;
    --text-muted: #9BA0A6;
    --text-dim: #61656C;
    --border: #2B2D31;
    --border-strong: #3C3F45;
    --border-faint: #232529;

    --accent: #2ECC8C;
    --accent-bright: #3DE39E;
    --accent-fg: #07130D;
    --accent-tint: #11352A;
    --accent-tint-2: #102A21;
    --accent-text: #4ADBA0;

    --warn: #D9A93F;
    --warn-soft: #38300F;
    --danger: #E0684F;
    --danger-soft: #3D1B12;
    --ok: #2ECC8C;
    --ok-soft: #143726;

    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px -8px rgba(0, 0, 0, 0.5);
    --shadow-pop: 0 2px 6px rgba(0, 0, 0, 0.5), 0 24px 60px -16px rgba(0, 0, 0, 0.75);
    --shadow-composer: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 32px -12px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg-app);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  #root { height: 100vh; }

  code, .mono { font-family: var(--font-mono); }
  .pixel { font-family: var(--font-pixel); font-weight: 400; letter-spacing: 0.04em; }

  button { font: inherit; cursor: pointer; color: inherit; background: none; border: none; padding: 0; }
  input, textarea { font-family: inherit; color: inherit; }
  ::selection { background: var(--accent-tint); color: var(--accent-text); }

  /* ── scrollbars: thin, unobtrusive ── */
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--text-dim); border: 2px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* ── dither checkerboard (retro) — paints with currentColor via mask ── */
  .dither {
    --dither-size: 2px;
    background-image: conic-gradient(currentColor 25%, transparent 0 50%, currentColor 0 75%, transparent 0);
    background-size: calc(var(--dither-size) * 2) calc(var(--dither-size) * 2);
  }

  /* ── shared focus ring ── */
  .focusable:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--bg-app), 0 0 0 4px var(--accent);
  }

  /* blinking block cursor for streaming */
  @keyframes pm-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .pm-cursor {
    display: inline-block; width: 7px; height: 15px;
    background: var(--accent-bright);
    vertical-align: -2px; margin-left: 2px;
    animation: pm-blink 0.9s steps(1) infinite;
  }

  @keyframes pm-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .pm-pulse { animation: pm-pulse 1.4s ease-in-out infinite; }

  @keyframes pm-fade-up {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .pm-enter { animation: pm-fade-up 0.22s ease both; }

  @media (prefers-reduced-motion: reduce) {
    .pm-cursor, .pm-pulse, .pm-enter { animation: none; }
  }

  /* markdown-ish content inside assistant messages */
  .pm-md p { margin: 0 0 10px; }
  .pm-md p:last-child { margin-bottom: 0; }
  .pm-md ul, .pm-md ol { margin: 6px 0 10px; padding-left: 22px; }
  .pm-md li { margin: 3px 0; }
  .pm-md strong { font-weight: 600; }
  .pm-md h4 {
    margin: 14px 0 6px; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
  }
  .pm-md code {
    font-size: 12.5px; background: var(--bg-raised);
    border: 1px solid var(--border-faint); border-radius: 4px; padding: 1px 5px;
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  // Fetch each JSX file (preserving the page's auth query string), transpile,
  // and eval in order — Babel's own src= loader drops the query string.
  (async function () {
    var q = window.location.search || '';
    var files = [
      'tweaks-panel.jsx',
      'pm-data.jsx',
      'pm-kit.jsx',
      'pm-sidebar.jsx',
      'pm-context.jsx',
      'pm-chat.jsx',
      'pm-composer.jsx',
      'pm-settings.jsx',
      'pm-onboarding.jsx',
      'pm-app.jsx',
    ];
    try {
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var resp = await fetch(f + q, { credentials: 'same-origin' });
        if (!resp.ok) throw new Error('Failed to load ' + f + ': ' + resp.status);
        var src = await resp.text();
        var out = Babel.transform(src, { presets: ['react'], filename: f }).code;
        (0, eval)(out);
      }
    } catch (e) {
      console.error('Bootstrap error:', e);
      document.getElementById('root').innerHTML =
        '<pre style="padding:24px;color:#C2452E;font-family:monospace;white-space:pre-wrap">'
        + (e && e.stack ? e.stack : String(e)) + '</pre>';
    }
  })();
</script>

</body>
</html>
