[project]
name = "momentum-backend"
version = "0.2.0"
description = "Momentum MVP backend — AI agent harness for Product Managers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    # SQLite (aiosqlite) is the default DB for the desktop build — no service
    # to install. asyncpg stays so a Postgres DATABASE_URL still works.
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Optional crash reporting — only active when SENTRY_DSN is set (off by
    # default; a desktop app must not phone home without opt-in).
    "sentry-sdk[fastapi]>=2.0",
    "openai>=1.50",
    "httpx>=0.27",
    "tavily-python>=0.5",
    "trafilatura>=1.12",
    "cryptography>=43",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    # F5: Google's native GenAI SDK — the second path to Gemini, required for
    # Gemini 3.x (the OpenAI-compat endpoint can't carry thought_signature).
    "google-genai>=2.7",
    # Feedback round 4: Claude models via Anthropic's official SDK.
    "anthropic>=0.49",
    # C8 onboarding document upload: multipart form parsing + PDF/DOCX text.
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # psycopg (sync) is only needed to run the test suite against Postgres
    # (set TEST_DATABASE_URL to a postgres URL). The default test DB is
    # SQLite, which needs no extra driver.
    "psycopg[binary]>=3.2",
    # Lint floor for CI (see [tool.ruff.lint] below).
    "ruff>=0.8",
    # Eval-scenario files (scripts/eval/scenarios/*.yaml) + their CI test.
    "pyyaml>=6.0",
    # WS client for the live skill-eval runner (scripts/eval/). The server
    # side already ships it via uvicorn[standard]; pinning it here keeps the
    # runner working even if uvicorn's extras change.
    "websockets>=12",
]
# Sprint 8B Stage 2: freezes the backend into the desktop sidecar binary.
# Only needed to BUILD the desktop app, not to run the web app or tests.
desktop = [
    "pyinstaller>=6.0",
    # Item 23 (P3): vault key in the macOS Keychain instead of a plaintext
    # file. Optional — app.config degrades to the file when this is absent.
    "keyring>=25",
]

[tool.setuptools.packages.find]
# Without this, setuptools' auto-discovery fails on a fresh `pip install -e .`
# because it sees `app/` AND `alembic/` as top-level dirs and refuses to
# pick. Restrict the package to `app/` (alembic is migrations, not a
# Python package; scripts/ and tests/ are dev tooling).
include = ["app*"]

[tool.uvicorn]
reload = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Deliberately minimal floor: syntax errors (E9), invalid literal comparisons
# (F63), forward-annotation/keyword misuse (F7), and undefined names (F82).
# These are always-bugs, never style. F401 (unused imports) has a handful of
# existing hits in app code owned by the engine revamp tracks — enable it once
# those land.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
