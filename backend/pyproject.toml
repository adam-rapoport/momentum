[project]
name = "pmomentum-backend"
version = "0.1.0"
description = "pMomentum MVP backend — AI agent harness for Product Managers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "openai>=1.50",
    "httpx>=0.27",
    "tavily-python>=0.5",
    "trafilatura>=1.12",
    "cryptography>=43",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # psycopg (sync) is used by tests/conftest.py to probe the test DB,
    # CREATE DATABASE pmomentum_test if missing, and run alembic
    # migrations against it. asyncpg handles the runtime connection.
    "psycopg[binary]>=3.2",
]

[tool.uvicorn]
reload = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
