[project]
name = "pmomentum-backend"
version = "0.1.0"
description = "pMomentum MVP backend — AI agent harness for Product Managers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "openai>=1.50",
    "httpx>=0.27",
    "tavily-python>=0.5",
    "trafilatura>=1.12",
    "cryptography>=43",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    # F5: Google's native GenAI SDK — the second path to Gemini, required for
    # Gemini 3.x (the OpenAI-compat endpoint can't carry thought_signature).
    "google-genai>=2.7",
    # C8 onboarding document upload: multipart form parsing + PDF/DOCX text.
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # psycopg (sync) is used by tests/conftest.py to probe the test DB,
    # CREATE DATABASE pmomentum_test if missing, and run alembic
    # migrations against it. asyncpg handles the runtime connection.
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
# Without this, setuptools' auto-discovery fails on a fresh `pip install -e .`
# because it sees `app/` AND `alembic/` as top-level dirs and refuses to
# pick. Restrict the package to `app/` (alembic is migrations, not a
# Python package; scripts/ and tests/ are dev tooling).
include = ["app*"]

[tool.uvicorn]
reload = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
